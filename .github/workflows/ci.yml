name: Backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run lint
      - run: npm run build
      - run: node delivery/docker/test-upgrade.cjs
      - run: npm test
      - run: npm run test:mobile
      - run: npm run test:torrent
      - run: npm run test:playback
      - run: npm run contract:check
      - run: npm run contract:test
      - run: npm run contract:kotlin
      - run: git diff --exit-code -- contract/kotlin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew compileKotlin --no-daemon
        working-directory: contract/kotlin
      - run: npm run contract:pack
      - uses: actions/upload-artifact@v4
        with:
          name: homestream-api
          path: '*.tgz'
      - run: docker build -t homestream-backend:test .
      - run: bash scripts/test-docker.sh homestream-backend:test

  publish:
    needs: verify
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homestream-publish:test
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
      - run: bash scripts/test-docker.sh homestream-publish:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag homestream-publish:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
