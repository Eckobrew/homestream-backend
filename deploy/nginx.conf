# Do not record scoped media tickets or legacy Cast debug payloads.
log_format homestream_path '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    location /api/ {
        access_log /var/log/nginx/access.log homestream_path;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-HomeStream-Socket "";
        proxy_set_header X-HomeStream-Proof "";
        proxy_set_header X-HomeStream-Local-Pairing "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location / {
        proxy_pass http://web:3002;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
