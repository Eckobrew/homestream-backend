services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HOMESTREAM_PORT:-3000}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      homestream:
        ipv4_address: 172.30.89.2
  backend:
    image: ${HOMESTREAM_BACKEND_IMAGE:-ghcr.io/eckobrew/homestream-backend:1.1.0}
    build:
      context: ..
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      HOMESTREAM_TRUSTED_PROXIES: 172.30.89.2
      HOMESTREAM_INTERNAL_URL: http://127.0.0.1:3001
      DOWNLOADS_PATH: /downloads
    volumes:
      - ${HOMESTREAM_DATA_PATH:-../data}:/app/data
      - ${HOMESTREAM_DOWNLOADS_PATH:-/mnt/downloads}:/downloads:ro
    # Optional direct pairing: set this to the host's LAN IP, never a public address.
    ports:
      - "${HOMESTREAM_PAIRING_BIND:-127.0.0.1}:3001:3001"
    networks:
      homestream:
        ipv4_address: 172.30.89.3
  web:
    image: ${HOMESTREAM_WEB_IMAGE:-ghcr.io/eckobrew/homestream-web:1.1.0}
    build:
      context: ../../homestream-web
    restart: unless-stopped
    environment:
      PORT: 3002
      HOSTNAME: 0.0.0.0
      HOMESTREAM_BACKEND_URL: http://backend:3001
    networks:
      homestream:
        ipv4_address: 172.30.89.4
networks:
  homestream:
    ipam:
      config:
        - subnet: 172.30.89.0/24
